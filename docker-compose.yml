# Bibliothekshackathon: Langflow mit Bibliotheks-Bausteinen
#
#   docker compose up -d                   -> Langflow unter http://localhost:7860
#   docker compose --profile lokal up -d   -> zusätzlich ein lokales Sprachmodell (Ollama)
#
# Einstellungen (Cluster-Adresse, Schlüssel, Modelle) stehen in der Datei .env.

# Fester Projektname: Die eigenen Flows liegen im Volume demo-bibliothekshackaton_langflow-daten,
# egal wie der Ordner heißt (ein ZIP von GitHub entpackt sich als ...-main).
name: demo-bibliothekshackaton

services:
  langflow:
    image: langflowai/langflow:1.12.3
    ports:
      - "7860:7860"
    env_file: .env
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: 7860
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_CONFIG_DIR: /app/langflow
      # Die Datenbank (eigene Flows, Variablen) gehört ins Volume. Sonst liegt sie im Container und ist
      # nach "docker compose down" oder einem Update weg.
      LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "true"
      LANGFLOW_COMPONENTS_PATH: /app/komponenten
      LANGFLOW_LOAD_FLOWS_PATH: /app/flows
      LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "true"
      LANGFLOW_SSRF_ALLOWED_HOSTS: host.docker.internal,ollama
      DO_NOT_TRACK: "true"
    volumes:
      - ./komponenten:/app/komponenten:ro
      - ./flows:/app/flows:ro
      - ./daten:/app/daten:ro
      - langflow-daten:/app/langflow
    extra_hosts:
      # macht ein auf dem Laptop installiertes Ollama auch unter Linux erreichbar
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: lokales Sprachmodell in Docker. Nur mit "--profile lokal" gestartet.
  # Auf dem Mac besser Ollama direkt installieren (nutzt dann die Grafikeinheit).
  ollama:
    image: ollama/ollama:latest
    profiles: [lokal]
    environment:
      OLLAMA_CONTEXT_LENGTH: 16384
    volumes:
      - ollama-modelle:/root/.ollama
    restart: unless-stopped

  # Lädt beim ersten Start das lokale Modell herunter (einmalig, einige GB).
  ollama-modell-laden:
    image: ollama/ollama:latest
    profiles: [lokal]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${LOKAL_MODELL:-qwen3.5:4b}"]
    restart: "no"

volumes:
  langflow-daten:
  ollama-modelle:
