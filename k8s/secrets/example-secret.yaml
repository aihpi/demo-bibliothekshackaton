# The credentials of the hosted instance. Copy this file to secret.yaml, fill in real values and
# seal it:
#
#   cp example-secret.yaml secret.yaml
#   ./seal.sh
#
# secret.yaml is gitignored, never commit it. The cluster only reads sealed-secret.yaml, which is
# the same secret encrypted with the cluster's public key and safe to commit. A change here means
# nothing until it is sealed again.
#
# Random values for the passwords and the secret key:
#   openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: bibliothekshackathon-secret
  namespace: bibliothekshackathon
type: Opaque
stringData:
  # The key for the AISC AI Hub (LiteLLM). Best a key of its own for the hackathon, with a budget
  # and an expiry date: all groups spend from it.
  AI_HUB_API_KEY: "YOUR_AI_HUB_KEY_HERE"

  # Optional. A free key from https://openalex.org/settings/api. Without it, OpenAlex throttles
  # or pauses searches, and all groups share one limit through the cluster's IP address.
  OPENALEX_API_KEY: ""

  # Two entries for one password: Postgres gets the password to initialise itself, Langflow gets
  # the whole URL. They have to agree, and the host is the langflow-db Service.
  DB_PASSWORD: "YOUR_DB_PASSWORD_HERE"
  LANGFLOW_DATABASE_URL: "postgresql://langflow:YOUR_DB_PASSWORD_HERE@langflow-db:5432/langflow"

  # The admin account "orga" (LANGFLOW_SUPERUSER in k8s/langflow/configmap.yaml).
  LANGFLOW_SUPERUSER_PASSWORD: "YOUR_ADMIN_PASSWORD_HERE"

  # Encrypts the variables and API keys Langflow stores. Never change it on a running instance.
  LANGFLOW_SECRET_KEY: "YOUR_SECRET_KEY_HERE"

  # One Langflow account per group, one line each: "name:password". k8s/konten/ creates them and
  # gives every account its own copy of the example flows. Add a line, seal, sync: a new group.
  # Removing a line does not delete the account.
  GRUPPEN_KONTEN: |
    gruppe01:YOUR_PASSWORD_HERE
    gruppe02:YOUR_PASSWORD_HERE
